name: Auto Deploy SmarterASP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore

      - name: Publish & Deploy via Web Deploy
        run: |
          dotnet publish -c Release `
            /p:WebPublishMethod=MSDeploy `
            /p:MSDeployServiceURL="${{ secrets.DEPLOY_URL }}" `
            /p:DeployIisAppPath="${{ secrets.DEPLOY_SITE }}" `
            /p:UserName="${{ secrets.DEPLOY_USER }}" `
            /p:Password="${{ secrets.DEPLOY_PASS }}" `
            /p:AllowUntrustedCertificate=true `
            /p:UseAppHost=false